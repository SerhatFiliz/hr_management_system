# ACADEMIC / PROFESSIONAL CONTEXT:
# This Docker Compose file defines a multi-container application environment. It allows us to
# declare, configure, and link all the independent services (database, web server, etc.)
# required to run our application. Using this file, the entire stack can be managed
# with a single command (e.g., 'docker compose up'), ensuring consistency and simplifying setup.

services:
  # --------------------------------------------------------------------------
  # SERVICE 1: PostgreSQL Database ('db')
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${SQL_DATABASE}
      - POSTGRES_USER=${SQL_USER}
      - POSTGRES_PASSWORD=${SQL_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER} -d ${SQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # SERVICE 2: Redis Message Broker ('redis')
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

  # --------------------------------------------------------------------------
  # SERVICE 3: Zookeeper (Kafka Dependency)
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # --------------------------------------------------------------------------
  # SERVICE 4: Kafka Event Streaming Platform
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      # MODIFICATION: The 'test' command must be prefixed with "CMD" to be valid.
      # This tells Docker to execute the command directly, without a shell.
      test: ["CMD", "/bin/kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Give Kafka more time to start up.

  # --------------------------------------------------------------------------
  # SERVICE 5: Django Web Application ('web')
  # --------------------------------------------------------------------------
  web:
    build: .
    command: gunicorn hr_management_system.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # MODIFICATION: Now waits for Kafka to be 'healthy', not just 'started'.
      kafka:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # SERVICE 6: Celery Background Worker ('celery_worker')
  # --------------------------------------------------------------------------
  celery_worker:
    build: .
    command: celery -A hr_management_system worker -l info
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # MODIFICATION: Now waits for Kafka to be 'healthy'.
      kafka:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # SERVICE 7: Celery Beat Scheduler ('celery_beat')
  # --------------------------------------------------------------------------
  celery_beat:
    build: .
    command: celery -A hr_management_system beat -l info
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # MODIFICATION: Now waits for Kafka to be 'healthy'.
      kafka:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # SERVICE 8: Kafka Consumer ('kafka_consumer')
  # --------------------------------------------------------------------------
  kafka_consumer:
    build: .
    command: python portal/kafka_consumer.py
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      # MODIFICATION: Now waits for Kafka to be 'healthy'.
      kafka:
        condition: service_healthy

# --------------------------------------------------------------------------
# VOLUMES
# --------------------------------------------------------------------------
volumes:
  postgres_data:
